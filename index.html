<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARCT — Reflection Captured Thoughts</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#08080A;height:100%}
  body{display:flex;align-items:center;justify-content:center}
  .ring{width:40px;height:40px;border:2px solid #252530;border-top-color:#A78BFA;border-radius:50%;animation:s .7s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="ring"></div>
<script>
(function(){
  var ua=navigator.userAgent||'';
  var m=/android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(ua)||window.innerWidth<800;
  var ref=new URLSearchParams(location.search).get('ref')||'';
  var d=(m?'pocket':'desktop')+'/index.html'+(ref?'?ref='+encodeURIComponent(ref):'');
  location.replace(d);
})();
</script>
</body>
</html>
