<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mmthee — Master your learning journey</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #f5f0eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .wrap { text-align: center; }
    video { width: 72px; height: 72px; object-fit: cover; border-radius: 16px; margin-bottom: 16px; }
    p { color: #7c4a35; font-size: 14px; opacity: 0.7; }
  </style>
</head>
<body>
  <div class="wrap">
    <video autoplay loop muted playsinline src="./desktop/logo.mp4"></video>
    <p>Loading mmthee…</p>
  </div>
  <script>
    (function () {
      var ua = navigator.userAgent || '';
      var isMobile =
        /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua) ||
        window.innerWidth < 768;
      var base = window.location.pathname.replace(/\/$/, '');
      window.location.replace(isMobile ? base + '/pocket/' : base + '/desktop/');
    })();
  </script>
</body>
</html>
