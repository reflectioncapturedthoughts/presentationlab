<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Presentation Lab</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
</head>
<body class="auth-page">
<div id="toast-container"></div>

<div style="max-width:460px;width:100%;margin:0 auto;">
  <div class="auth-logo">
    <img src="l.png" alt="logo" class="auth-logo-img" />
    <div class="auth-logo-name">Presentation Lab</div>
    <p style="font-size:0.78rem;color:var(--stone);margin-top:2px;">by <a href="https://finbgold.netlify.app" target="_blank" style="color:var(--terra);">Fake International Bank</a></p>
  </div>

  <div class="panel">
    <div style="background:linear-gradient(135deg,rgba(201,108,84,0.08),var(--sand-warm));border-radius:var(--radius-md);padding:12px 16px;margin-bottom:22px;font-size:0.8rem;color:var(--brown);text-align:center;">
      <strong style="color:var(--espresso);">Google sign-in only.</strong> Use your Google account to join and contribute.
    </div>

    <div class="panel-eyebrow">Welcome</div>
    <h2 class="panel-title">Sign in to Presentation Lab</h2>
    <p class="panel-subtitle">Continue with Google to access all features — writing, collaborating, earning points.</p>

    <button class="btn btn-google btn-full btn-lg" id="google-btn" style="margin-bottom:14px;justify-content:center;gap:12px;">
      <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.08 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.36-8.16 2.36-6.26 0-11.57-3.59-13.48-8.71l-7.98 6.2C6.51 42.62 14.62 48 24 48z"/></svg>
      Continue with Google
    </button>

    <div class="divider">or</div>

    <button class="btn btn-ms btn-full" id="ms-btn" style="margin-bottom:10px;">
      <svg width="18" height="18" viewBox="0 0 21 21"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>
      Continue with Microsoft
    </button>

    <p style="margin-top:20px;font-size:0.76rem;text-align:center;color:var(--stone);">
      <a href="/" style="color:var(--terra);">← Back to Presentation Lab</a>
    </p>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";
import {
  getAuth, onAuthStateChanged, GoogleAuthProvider, OAuthProvider, signInWithPopup
} from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDwUYRjUe7wKHp64d1vfYV-UDvnXaUuQVY",
  authDomain: "reflectioncapturedthoughts.firebaseapp.com",
  projectId: "reflectioncapturedthoughts",
  storageBucket: "reflectioncapturedthoughts.firebasestorage.app",
  messagingSenderId: "331335730832",
  appId: "1:331335730832:web:731df65bd40f9646adfa15"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const googleProvider = new GoogleAuthProvider();
const msProvider = new OAuthProvider("microsoft.com");

function toast(msg, type="info") {
  const c = document.getElementById("toast-container");
  const t = document.createElement("div");
  t.className = `toast toast-${type}`;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => { t.style.opacity="0";t.style.transition="opacity 0.3s";setTimeout(()=>t.remove(),300); }, 4500);
}
function setLoading(btn, v) {
  if(v){btn.dataset.orig=btn.innerHTML;btn.innerHTML=`<span class="spinner"></span>`;btn.disabled=true;}
  else{btn.innerHTML=btn.dataset.orig||btn.innerHTML;btn.disabled=false;}
}

/**
 * Always saves/updates the user in the bloggers collection.
 * - Identity fields (name, email, photo) are always synced.
 * - points, kvRank, createdAt are only set on first creation.
 */
async function saveBlogger(user) {
  const ref = doc(db, "bloggers", user.uid);
  try {
    const snap = await getDoc(ref);
    if (snap.exists()) {
      // Update identity fields only — never overwrite points or rank
      await setDoc(ref, {
        uid: user.uid,
        fullName: user.displayName || snap.data().fullName || "",
        email: user.email || snap.data().email || "",
        photoURL: user.photoURL || snap.data().photoURL || "",
      }, { merge: true });
    } else {
      // First time — create with all defaults
      await setDoc(ref, {
        uid: user.uid,
        fullName: user.displayName || "",
        email: user.email || "",
        photoURL: user.photoURL || "",
        points: 0,
        kvRank: "daily",
        createdAt: new Date().toISOString()
      });
    }
  } catch(e) {
    console.error("saveBlogger error:", e);
  }
}

onAuthStateChanged(auth, user => {
  if (user) {
    const redirect = new URLSearchParams(window.location.search).get("redirect") || "/";
    window.location.href = redirect;
  }
});

async function oauthSignIn(provider, btn) {
  setLoading(btn, true);
  try {
    const result = await signInWithPopup(auth, provider);
    await saveBlogger(result.user);
    toast("Welcome, " + (result.user.displayName || result.user.email) + "!", "success");
    setTimeout(() => {
      const redirect = new URLSearchParams(window.location.search).get("redirect") || "/";
      window.location.href = redirect;
    }, 800);
  } catch(e) {
    const msg = e.code === "auth/popup-closed-by-user" ? "Sign-in cancelled." :
                e.code === "auth/popup-blocked" ? "Popup blocked. Please allow popups for this site." :
                e.code === "auth/account-exists-with-different-credential" ? "Account already exists with a different provider." :
                e.message;
    toast(msg, "error");
    setLoading(btn, false);
  }
}

document.getElementById("google-btn").addEventListener("click", e => oauthSignIn(googleProvider, e.currentTarget));
document.getElementById("ms-btn").addEventListener("click", e => oauthSignIn(msProvider, e.currentTarget));
</script>
</body>
</html>
