<body>

<div class="app">

  </nav>
  <div class="sidebar-footer"><div class="sidebar-user" id="sb-user" onclick="location.href='profile.html'" style="display:none"><div class="avatar avatar-sm" id="sb-av"></div><div class="sidebar-user-info"><div class="sidebar-user-name" id="sb-name"></div><div class="sidebar-user-pts"><span id="sb-pts">0</span> pts</div></div></div><button class="sidebar-sign-in" id="sb-signin" onclick="location.href='auth.html'" style="display:none"><svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9"/></svg>Sign In</button></div>
</aside>
<main class="main">
  <div class="page-wrap">
    <div style="margin-bottom:36px">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
        <h1 class="page-title" style="margin:0">AVR Picks</h1>
        <span class="avr-badge">Editor's Choice</span>
      </div>
      <p class="page-subtitle">Content handpicked by the ARCT editorial team.</p>
    </div>
    <div id="aavrit-content" style="display:none">
      <div id="picks-grid" class="post-grid"></div>
      <div id="empty-state" class="empty" style="display:none">
        <p class="empty-title">No AVR Picks yet</p>
        <p class="empty-sub">The editorial team hasn't selected any picks yet.</p>
        <a href="index.html" class="btn btn-primary">Browse All Posts</a>
      </div>
    </div>
    <div id="admin-panel" style="display:none;margin-top:40px">
      <div class="divider"></div>
      <div class="section-header"><span class="section-title">Admin: Manage AVR Picks</span></div>
      <div class="card" style="padding:0">
        <div id="all-posts-list"></div>
        <div id="all-posts-loading" style="text-align:center;padding:40px"><div class="spinner spin"></div></div>
      </div>
    </div>
    <div id="loading-state" style="text-align:center;padding:80px"><div class="spinner spin"></div></div>
  </div>
</main>
</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
import{getFirestore,doc,getDoc,updateDoc,collection,query,orderBy,where,limit,getDocs}from"https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
const FB={apiKey:"AIzaSyDwUYRjUe7wKHp64d1vfYV-UDvnXaUuQVY",authDomain:"reflectioncapturedthoughts.firebaseapp.com",projectId:"reflectioncapturedthoughts",storageBucket:"reflectioncapturedthoughts.firebasestorage.app",messagingSenderId:"331335730832",appId:"1:331335730832:web:731df65bd40f9646adfa15",measurementId:"G-7NXNZDNDRE"};
const app=initializeApp(FB);const db=getFirestore(app);const auth=getAuth(app);
let currentUser=null,allPosts=[],avrPosts=[];
function esc(s=''){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function initials(n){return(n||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2)}
function timeAgo(d){if(!d)return'';const ms=d?.toMillis?d.toMillis():new Date(d).getTime();const diff=(Date.now()-ms)/1000;if(diff<60)return'just now';if(diff<3600)return Math.floor(diff/60)+'m ago';if(diff<86400)return Math.floor(diff/3600)+'h ago';return Math.floor(diff/86400)+'d ago'}
function toast(msg,type='info'){const w=document.getElementById('toast-wrap');const t=document.createElement('div');t.className=`toast toast-${type}`;t.textContent=msg;w.appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300)},5000)}

function postCard(p){
  const ph=p.authorPhoto||'';
  return`<article class="post-card" onclick="location.href='presentation.html?id=${p.id}&col=${p._col}'">
    <div class="post-card-top"><div class="post-card-meta"><div class="avatar avatar-sm">${ph?`<img src="${esc(ph)}" loading="lazy">`:esc(initials(p.authorName))}</div><span class="post-card-author">${esc(p.authorName||'Member')}</span><span class="post-card-time">${timeAgo(p.createdAt)}</span></div><span class="avr-badge">AVR Pick</span></div>
    <h2 class="post-card-title">${esc(p.title||'Untitled')}</h2>
    ${p.content?`<p class="post-card-excerpt">${esc((p.content||'').substring(0,180))}</p>`:''}
    <div class="post-card-footer"><div class="post-card-likes"><svg viewBox="0 0 24 24"><path d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z"/></svg>${p.likes||0}</div><span class="post-card-read">Read <svg viewBox="0 0 24 24"><path d="M4.5 12h15m0 0l-6.75-6.75M19.5 12l-6.75 6.75"/></svg></span></div>
  </article>`;
}
window.toggleAVR=async function(id,col,current){
  const newVal=!current;
  try{
    await updateDoc(doc(db,col,id),{isAVRPick:newVal});
    allPosts=allPosts.map(p=>p.id===id?{...p,isAVRPick:newVal}:p);
    avrPosts=allPosts.filter(p=>p.isAVRPick);
    renderAVRPicks();renderAdminList();
    toast(newVal?'Marked as AVR Pick':'Removed from AVR Picks','success');
  }catch(e){toast('Update failed: '+e.message,'error');}
};
function renderAVRPicks(){
  document.getElementById('picks-grid').innerHTML=avrPosts.map(postCard).join('');
  document.getElementById('empty-state').style.display=avrPosts.length?'none':'block';
}
function renderAdminList(){
  document.getElementById('all-posts-loading').style.display='none';
  document.getElementById('all-posts-list').innerHTML=allPosts.map(p=>`
    <div class="admin-post-row">
      <div style="flex:1;min-width:0"><div style="font-weight:600;font-size:.88rem;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.title||'Untitled')}</div><div style="font-size:.75rem;color:var(--text-3);margin-top:2px">${esc(p.authorName||'Member')} · ${esc(p._col)}</div></div>
      <div style="display:flex;gap:8px;align-items:center">
        ${p.isAVRPick?'<span class="avr-badge">Pick</span>':''}
        <button class="btn btn-sm ${p.isAVRPick?'btn-ghost':'btn-primary'}" onclick="toggleAVR('${p.id}','${p._col}',${p.isAVRPick})">${p.isAVRPick?'Remove':'✦ Pick'}</button>
      </div>
    </div>
  `).join('');
}
async function loadPosts(){
  const[presSnap,gitSnap]=await Promise.all([
    getDocs(query(collection(db,'presentations'),orderBy('createdAt','desc'),limit(60))).catch(()=>({docs:[]})),
    getDocs(query(collection(db,'gitjit'),orderBy('createdAt','desc'),limit(60))).catch(()=>({docs:[]}))
  ]);
  allPosts=[];
  presSnap.docs.forEach(d=>allPosts.push({id:d.id,...d.data(),_col:'presentations'}));
  gitSnap.docs.forEach(d=>allPosts.push({id:d.id,...d.data(),_col:'gitjit'}));
  allPosts.sort((a,b)=>(b.createdAt?.toMillis?.()??0)-(a.createdAt?.toMillis?.()??0));
  avrPosts=allPosts.filter(p=>p.isAVRPick);
  document.getElementById('loading-state').style.display='none';
  document.getElementById('aavrit-content').style.display='block';
  renderAVRPicks();
  if(currentUser)renderAdminList();
}
onAuthStateChanged(auth,async user=>{
  currentUser=user;
  if(user){
    document.getElementById('sb-user').style.display='flex';document.getElementById('sb-signin').style.display='none';
    const snap=await getDoc(doc(db,'buddies',user.uid)).catch(()=>null);const data=snap?.data()||{};
    document.getElementById('sb-name').textContent=user.displayName||'Member';
    document.getElementById('sb-pts').textContent=(data.points||0).toLocaleString();
    const av=document.getElementById('sb-av');if(user.photoURL)av.innerHTML=`<img src="${user.photoURL}">`;else av.textContent=initials(user.displayName||'M');
    document.getElementById('admin-panel').style.display='block';
  }else{document.getElementById('sb-user').style.display='none';document.getElementById('sb-signin').style.display='flex';}
  loadPosts();
});
</script>
</body>
</html>
