<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="toast-wrap"></div>
<div class="app">
<aside class="sidebar">
  <div class="sidebar-logo"><a href="index.html" style="display:flex;align-items:center;gap:10px;text-decoration:none"><div class="logo-wrap"><img src="../assets/l.png" alt="ARCT"><video autoplay muted loop playsinline><source src="../assets/logo.mp4" type="video/mp4"></video></div><span class="logo-name">ARCT</span></a></div>
  <nav class="sidebar-nav">
    <a href="index.html" class="nav-item active"><svg viewBox="0 0 24 24"><path d="M2.25 12l8.954-8.955a1.125 1.125 0 011.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"/></svg>Home</a>
    <a href="leaderboard.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M16.5 18.75h-9m9 0a3 3 0 013 3h-15a3 3 0 013-3m9 0v-3.375c0-.621-.503-1.125-1.125-1.125h-.871M7.5 18.75v-3.375c0-.621.504-1.125 1.125-1.125h.872m5.007 0H9.497m5.007 0a7.454 7.454 0 01-.982-3.172M9.497 14.25a7.454 7.454 0 00.981-3.172M5.25 4.236c-.982.143-1.954.317-2.916.52A6.003 6.003 0 007.73 9.728M5.25 4.236V4.5c0 2.108.966 3.99 2.48 5.228M5.25 4.236V2.721C7.456 2.41 9.71 2.25 12 2.25c2.291 0 4.545.16 6.75.47v1.516M7.73 9.728a6.726 6.726 0 002.748 1.35m8.272-6.842V4.5c0 2.108-.966 3.99-2.48 5.228m2.48-5.492a46.32 46.32 0 012.916.52 6.003 6.003 0 01-5.395 4.972m0 0a6.726 6.726 0 01-2.749 1.35m0 0a6.772 6.772 0 01-3.044 0"/></svg>Leaderboard</a>
    <a href="creativecreator.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10"/></svg>Create</a>
    <a href="shop.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007zM8.625 10.5a.375.375 0 11-.75 0 .375.375 0 01.75 0zm7.5 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z"/></svg>Shop</a>
    <a href="profile.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M17.982 18.725A7.488 7.488 0 0012 15.75a7.488 7.488 0 00-5.982 2.975m11.963 0a9 9 0 10-11.963 0m11.963 0A8.966 8.966 0 0112 21a8.966 8.966 0 01-5.982-2.275M15 9.75a3 3 0 11-6 0 3 3 0 016 0z"/></svg>Profile</a>
  </nav>
  <div class="sidebar-footer"><div class="sidebar-user" id="sb-user" onclick="location.href='profile.html'" style="display:none"><div class="avatar avatar-sm" id="sb-av"></div><div class="sidebar-user-info"><div class="sidebar-user-name" id="sb-name"></div><div class="sidebar-user-pts"><span id="sb-pts">0</span> pts</div></div></div><button class="sidebar-sign-in" id="sb-signin" onclick="location.href='auth.html'" style="display:none"><svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9"/></svg>Sign In</button></div>
</aside>
<main class="main">
  <div class="page-wrap-narrow">
    <div id="loading-state" style="text-align:center;padding:100px"><div class="spinner spin"></div></div>
    <div id="post-content" style="display:none">
      <a href="index.html" class="btn btn-ghost btn-sm" style="margin-bottom:32px;display:inline-flex;align-items:center;gap:6px">
        <svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M19.5 12h-15m0 0l6.75 6.75M4.5 12l6.75-6.75"/></svg> Back
      </a>
      <div id="avr-wrap" style="display:none;margin-bottom:16px"><span class="avr-badge">AVR Pick</span></div>
      <h1 class="pres-title" id="pres-title"></h1>
      <div class="pres-byline">
        <div class="avatar avatar-md" id="pres-av"></div>
        <div>
          <div style="font-weight:600;font-size:.95rem;color:var(--text)" id="pres-author"></div>
          <div style="font-size:.8rem;color:var(--text-3);margin-top:2px" id="pres-time"></div>
        </div>
        <div id="pres-tags" style="margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center"></div>
      </div>
      <div class="divider"></div>
      <div class="pres-body" id="pres-body"></div>
      <div class="divider"></div>
      <div class="pres-actions">
        <button class="like-btn" id="like-btn" onclick="toggleLike()">
          <svg viewBox="0 0 24 24"><path d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z"/></svg>
          <span id="like-count">0</span> <span style="font-size:.8rem;color:var(--text-3)">likes</span>
        </button>
        <button class="btn btn-ghost btn-sm" onclick="share()" style="margin-left:auto">
          <svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="M7.217 10.907a2.25 2.25 0 100 2.186m0-2.186c.18.324.283.696.283 1.093s-.103.77-.283 1.093m0-2.186l9.566-5.314m-9.566 7.5l9.566 5.314m0 0a2.25 2.25 0 103.935 2.186 2.25 2.25 0 00-3.935-2.186zm0-12.814a2.25 2.25 0 103.933-2.185 2.25 2.25 0 00-3.933 2.185z"/></svg>
          Share
        </button>
      </div>
    </div>
    <div id="not-found" class="empty" style="display:none"><p class="empty-title">Post not found</p><p class="empty-sub">This post may have been removed.</p><a href="index.html" class="btn btn-primary">Go Home</a></div>
  </div>
</main>
</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
import{getFirestore,doc,getDoc,updateDoc,increment,arrayUnion,arrayRemove}from"https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
const FB={apiKey:"AIzaSyDwUYRjUe7wKHp64d1vfYV-UDvnXaUuQVY",authDomain:"reflectioncapturedthoughts.firebaseapp.com",projectId:"reflectioncapturedthoughts",storageBucket:"reflectioncapturedthoughts.firebasestorage.app",messagingSenderId:"331335730832",appId:"1:331335730832:web:731df65bd40f9646adfa15",measurementId:"G-7NXNZDNDRE"};
const app=initializeApp(FB);const db=getFirestore(app);const auth=getAuth(app);
const params=new URLSearchParams(location.search);
const postId=params.get('id'),colName=params.get('col')||'presentations';
let currentUser=null,postData=null,liked=false;
function esc(s=''){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function initials(n){return(n||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2)}
function timeAgo(d){if(!d)return'';const ms=d?.toMillis?d.toMillis():new Date(d).getTime();const diff=(Date.now()-ms)/1000;if(diff<60)return'just now';if(diff<3600)return Math.floor(diff/60)+'m ago';if(diff<86400)return Math.floor(diff/3600)+'h ago';return Math.floor(diff/86400)+'d ago'}
function nl2p(s){return'<p>'+s.split('\n\n').map(p=>esc(p.trim())).filter(Boolean).join('</p><p>')+'</p>'}
function toast(msg,type='info'){const w=document.getElementById('toast-wrap');const t=document.createElement('div');t.className=`toast toast-${type}`;t.textContent=msg;w.appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300)},4000)}
function updateLikeBtn(){const b=document.getElementById('like-btn');liked?b.classList.add('liked'):b.classList.remove('liked');}
async function loadPost(){
  if(!postId){showNotFound();return;}
  const snap=await getDoc(doc(db,colName,postId)).catch(()=>null);
  if(!snap||!snap.exists()){showNotFound();return;}
  postData={id:snap.id,...snap.data()};
  document.title=(postData.title||'Post')+' — ARCT';
  document.getElementById('loading-state').style.display='none';
  document.getElementById('post-content').style.display='block';
  if(postData.isAVRPick)document.getElementById('avr-wrap').style.display='block';
  document.getElementById('pres-title').textContent=postData.title||'Untitled';
  const av=document.getElementById('pres-av');
  if(postData.authorPhoto)av.innerHTML=`<img src="${esc(postData.authorPhoto)}" loading="lazy">`;
  else av.textContent=initials(postData.authorName);
  document.getElementById('pres-author').textContent=postData.authorName||'Member';
  document.getElementById('pres-time').textContent=timeAgo(postData.createdAt)+' · '+colName;
  if(postData.tags?.length)document.getElementById('pres-tags').innerHTML=postData.tags.map(t=>`<span class="badge badge-surface">${esc(t)}</span>`).join('');
  document.getElementById('pres-body').innerHTML=nl2p(postData.content||'(No content)');
  document.getElementById('like-count').textContent=postData.likes||0;
  if(currentUser){liked=(postData.likedBy||[]).includes(currentUser.uid);updateLikeBtn();}
}
function showNotFound(){document.getElementById('loading-state').style.display='none';document.getElementById('not-found').style.display='block';}
window.toggleLike=async function(){
  if(!currentUser){toast('Sign in to like posts','info');location.href='auth.html?redirect='+encodeURIComponent(location.href);return;}
  if(!postData)return;
  liked=!liked;
  const delta=liked?1:-1;
  document.getElementById('like-count').textContent=Math.max(0,(parseInt(document.getElementById('like-count').textContent)||0)+delta);
  updateLikeBtn();
  const postRef=doc(db,colName,postId);
  const meRef=doc(db,'buddies',currentUser.uid);
  try{
    if(liked){
      await Promise.all([
        updateDoc(postRef,{likes:increment(1),likedBy:arrayUnion(currentUser.uid)}),
        updateDoc(meRef,{likedPosts:arrayUnion(postId)}),
        postData.uid&&postData.uid!==currentUser.uid?updateDoc(doc(db,'buddies',postData.uid),{points:increment(1)}):Promise.resolve()
      ]);
    }else{
      await Promise.all([
        updateDoc(postRef,{likes:increment(-1),likedBy:arrayRemove(currentUser.uid)}),
        updateDoc(meRef,{likedPosts:arrayRemove(postId)}),
        postData.uid&&postData.uid!==currentUser.uid?updateDoc(doc(db,'buddies',postData.uid),{points:increment(-1)}):Promise.resolve()
      ]);
    }
  }catch(e){liked=!liked;document.getElementById('like-count').textContent=Math.max(0,(parseInt(document.getElementById('like-count').textContent)||0)-delta);updateLikeBtn();}
};
window.share=function(){navigator.clipboard.writeText(location.href).then(()=>toast('Link copied!','success')).catch(()=>toast('Could not copy link','error'))};
onAuthStateChanged(auth,async user=>{
  currentUser=user;
  if(user){
    document.getElementById('sb-user').style.display='flex';document.getElementById('sb-signin').style.display='none';
    const snap=await getDoc(doc(db,'buddies',user.uid)).catch(()=>null);const data=snap?.data()||{};
    document.getElementById('sb-name').textContent=user.displayName||'Member';
    document.getElementById('sb-pts').textContent=(data.points||0).toLocaleString();
    const av=document.getElementById('sb-av');
    if(user.photoURL)av.innerHTML=`<img src="${user.photoURL}">`;else av.textContent=initials(user.displayName||'M');
    if(postData){liked=(postData.likedBy||[]).includes(user.uid)||(data.likedPosts||[]).includes(postId);updateLikeBtn();}
  }else{document.getElementById('sb-user').style.display='none';document.getElementById('sb-signin').style.display='flex';}
});
loadPost();
</script>
</body>
</html>
