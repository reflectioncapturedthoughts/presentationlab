<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop — ARCT</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="toast-wrap"></div>
<div class="modal-bg" id="buy-modal">
  <div class="modal" style="position:relative">
    <button class="modal-close" onclick="closeBuyModal()">×</button>
    <div class="modal-title" id="modal-title">Confirm Purchase</div>
    <div class="modal-sub" id="modal-sub"></div>
    <div style="background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);padding:16px 20px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center">
      <span style="font-size:.84rem;color:var(--text-2)">Your balance</span>
      <span style="font-weight:700;color:var(--accent)" id="modal-balance">0 pts</span>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-ghost btn-full" onclick="closeBuyModal()">Cancel</button>
      <button class="btn btn-primary btn-full" id="modal-confirm-btn" onclick="confirmPurchase()">Confirm</button>
    </div>
  </div>
</div>
<div class="app">
<aside class="sidebar">
  <div class="sidebar-logo"><a href="index.html" style="display:flex;align-items:center;gap:10px;text-decoration:none"><div class="logo-wrap"><img src="../assets/l.png" alt="ARCT"><video autoplay muted loop playsinline><source src="../assets/logo.mp4" type="video/mp4"></video></div><span class="logo-name">ARCT</span></a></div>
  <nav class="sidebar-nav">
    <a href="index.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M2.25 12l8.954-8.955a1.125 1.125 0 011.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"/></svg>Home</a>
    <a href="leaderboard.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M16.5 18.75h-9m9 0a3 3 0 013 3h-15a3 3 0 013-3m9 0v-3.375c0-.621-.503-1.125-1.125-1.125h-.871M7.5 18.75v-3.375c0-.621.504-1.125 1.125-1.125h.872m5.007 0H9.497m5.007 0a7.454 7.454 0 01-.982-3.172M9.497 14.25a7.454 7.454 0 00.981-3.172M5.25 4.236c-.982.143-1.954.317-2.916.52A6.003 6.003 0 007.73 9.728M5.25 4.236V4.5c0 2.108.966 3.99 2.48 5.228M5.25 4.236V2.721C7.456 2.41 9.71 2.25 12 2.25c2.291 0 4.545.16 6.75.47v1.516M7.73 9.728a6.726 6.726 0 002.748 1.35m8.272-6.842V4.5c0 2.108-.966 3.99-2.48 5.228m2.48-5.492a46.32 46.32 0 012.916.52 6.003 6.003 0 01-5.395 4.972m0 0a6.726 6.726 0 01-2.749 1.35m0 0a6.772 6.772 0 01-3.044 0"/></svg>Leaderboard</a>
    <a href="creativecreator.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10"/></svg>Create</a>
    <a href="shop.html" class="nav-item active"><svg viewBox="0 0 24 24"><path d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007zM8.625 10.5a.375.375 0 11-.75 0 .375.375 0 01.75 0zm7.5 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z"/></svg>Shop</a>
    <a href="profile.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M17.982 18.725A7.488 7.488 0 0012 15.75a7.488 7.488 0 00-5.982 2.975m11.963 0a9 9 0 10-11.963 0m11.963 0A8.966 8.966 0 0112 21a8.966 8.966 0 01-5.982-2.275M15 9.75a3 3 0 11-6 0 3 3 0 016 0z"/></svg>Profile</a>
  </nav>
  <div class="sidebar-footer"><div class="sidebar-user" id="sb-user" onclick="location.href='profile.html'" style="display:none"><div class="avatar avatar-sm" id="sb-av"></div><div class="sidebar-user-info"><div class="sidebar-user-name" id="sb-name"></div><div class="sidebar-user-pts"><span id="sb-pts">0</span> pts</div></div></div><button class="sidebar-sign-in" id="sb-signin" onclick="location.href='auth.html'" style="display:none"><svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9"/></svg>Sign In</button></div>
</aside>
<main class="main">
  <div class="page-wrap">
    <div style="margin-bottom:36px"><h1 class="page-title">Shop</h1><p class="page-subtitle">Spend your points on exclusive perks and upgrades.</p></div>
    <div class="pts-balance" id="pts-bar">
      <div><div class="pts-balance-val" id="pts-val">—</div><div class="pts-balance-lbl">Your Points</div></div>
      <svg viewBox="0 0 24 24" style="width:28px;height:28px;stroke:var(--accent);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;opacity:.4"><path d="M12 6v12m-3-2.818l.879.659c1.171.879 3.07.879 4.242 0 1.172-.879 1.172-2.303 0-3.182C13.536 12.219 12.768 12 12 12c-.725 0-1.45-.22-2.003-.659-1.106-.879-1.106-2.303 0-3.182s2.9-.879 4.006 0l.415.33M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    </div>
    <div class="filter-row" id="cat-filter">
      <button class="filter-chip active" data-cat="">All</button>
      <button class="filter-chip" data-cat="Profile">Profile</button>
      <button class="filter-chip" data-cat="Boost">Boost</button>
      <button class="filter-chip" data-cat="Access">Access</button>
      <button class="filter-chip" data-cat="Creator">Creator</button>
    </div>
    <div id="shop-grid" class="shop-grid"></div>
    <div id="loading-state" style="text-align:center;padding:64px"><div class="spinner spin"></div></div>
    <div id="empty-state" class="empty" style="display:none"><p class="empty-title">Shop coming soon</p><p class="empty-sub">Products will appear here once seeded by an admin.</p></div>
  </div>
</main>
</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
import{getFirestore,doc,getDoc,setDoc,collection,query,orderBy,getDocs,updateDoc,increment,arrayUnion,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
const FB={apiKey:"AIzaSyDwUYRjUe7wKHp64d1vfYV-UDvnXaUuQVY",authDomain:"reflectioncapturedthoughts.firebaseapp.com",projectId:"reflectioncapturedthoughts",storageBucket:"reflectioncapturedthoughts.firebasestorage.app",messagingSenderId:"331335730832",appId:"1:331335730832:web:731df65bd40f9646adfa15",measurementId:"G-7NXNZDNDRE"};
const app=initializeApp(FB);const db=getFirestore(app);const auth=getAuth(app);
let currentUser=null,userPts=0,userPurchases=[],allProducts=[],currentCat='',pendingProduct=null;
function esc(s=''){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function initials(n){return(n||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2)}
function toast(msg,type='info'){const w=document.getElementById('toast-wrap');const t=document.createElement('div');t.className=`toast toast-${type}`;t.textContent=msg;w.appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300)},4500)}

function productCard(p){
  const owned=userPurchases.some(x=>(x.productId||x)===p.id);
  const canAfford=userPts>=p.pointPrice;
  return`<div class="shop-card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <div class="shop-icon">${esc(p.icon||'?')}</div>
      <span class="badge badge-surface">${esc(p.category||'Item')}</span>
    </div>
    <div class="shop-name">${esc(p.name)}</div>
    <div class="shop-desc">${esc(p.description||'')}</div>
    <div class="shop-footer">
      <div><div class="shop-price">${(p.pointPrice||0).toLocaleString()} <span>pts</span></div></div>
      ${owned?`<span class="shop-owned">Owned</span>`:currentUser?`<button class="btn btn-primary btn-sm" ${canAfford?'':'disabled'} onclick="buyProduct('${p.id}','${esc(p.name)}',${p.pointPrice})">${canAfford?'Buy':'Insufficient pts'}</button>`:`<button class="btn btn-ghost btn-sm" onclick="location.href='auth.html'">Sign in</button>`}
    </div>
  </div>`;
}

function renderProducts(){
  const filtered=currentCat?allProducts.filter(p=>p.category===currentCat):allProducts;
  document.getElementById('loading-state').style.display='none';
  if(!filtered.length){document.getElementById('empty-state').style.display='block';document.getElementById('shop-grid').innerHTML='';return;}
  document.getElementById('empty-state').style.display='none';
  document.getElementById('shop-grid').innerHTML=filtered.map(productCard).join('');
}

window.buyProduct=function(id,name,price){
  if(!currentUser){location.href='auth.html';return;}
  pendingProduct={id,name,price};
  document.getElementById('modal-title').textContent='Purchase '+name;
  document.getElementById('modal-sub').textContent=`This will deduct ${price.toLocaleString()} pts from your balance.`;
  document.getElementById('modal-balance').textContent=userPts.toLocaleString()+' pts';
  document.getElementById('buy-modal').classList.add('open');
};
window.closeBuyModal=function(){document.getElementById('buy-modal').classList.remove('open');pendingProduct=null;};
window.confirmPurchase=async function(){
  if(!pendingProduct||!currentUser)return;
  const btn=document.getElementById('modal-confirm-btn');
  btn.disabled=true;btn.textContent='Processing…';
  try{
    const bRef=doc(db,'buddies',currentUser.uid);
    const snap=await getDoc(bRef);
    const data=snap?.data()||{};
    if((data.points||0)<pendingProduct.price){toast('Insufficient points','error');return;}
    if((data.purchases||[]).some(x=>(x.productId||x)===pendingProduct.id)){toast('Already owned','error');return;}
    const purchaseRecord={productId:pendingProduct.id,productName:pendingProduct.name,pointPrice:pendingProduct.price,purchasedAt:new Date().toISOString()};
    await updateDoc(bRef,{points:increment(-pendingProduct.price),purchases:arrayUnion(purchaseRecord)});
    userPts-=pendingProduct.price;
    userPurchases.push(purchaseRecord);
    document.getElementById('pts-val').textContent=userPts.toLocaleString();
    document.getElementById('sb-pts').textContent=userPts.toLocaleString();
    toast(`${pendingProduct.name} purchased!`,'success');
    closeBuyModal();
    renderProducts();
  }catch(e){toast('Purchase failed: '+e.message,'error');}
  btn.disabled=false;btn.textContent='Confirm';
};

document.querySelectorAll('.filter-chip').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('#cat-filter .filter-chip').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');currentCat=b.dataset.cat||'';renderProducts();
}));

const FALLBACK_PRODUCTS=[
  {id:'badge',name:'Creator Badge',description:'Exclusive badge on your profile that shows you are a verified creator.',icon:'◆',category:'Profile',pointPrice:125,available:true},
  {id:'theme',name:'Custom Profile Theme',description:'Unlock premium dark themes and accent color customization.',icon:'◈',category:'Profile',pointPrice:250,available:true},
  {id:'boost',name:'Post Feature Boost',description:'Boost one of your posts to the top of the feed for 24 hours.',icon:'▲',category:'Boost',pointPrice:500,available:true},
  {id:'pack',name:'Creator Resource Pack',description:'Curated templates, prompts, and writing tools for creators.',icon:'◇',category:'Creator',pointPrice:750,available:true},
  {id:'access',name:'Exclusive Content Access',description:'Access to premium community content and early features.',icon:'◉',category:'Access',pointPrice:1000,available:true},
  {id:'mentor',name:'Mentorship Session',description:'45-minute one-on-one session with a top ARCT creator.',icon:'●',category:'Creator',pointPrice:1500,available:true},
  {id:'vip',name:'VIP Status',description:'VIP badge, priority support, and exclusive monthly perks.',icon:'◎',category:'Access',pointPrice:2500,available:true},
  {id:'lifetime',name:'Lifetime Creator Pass',description:'Unlock all present and future premium features — forever.',icon:'★',category:'Access',pointPrice:5000,available:true},
];

async function loadProducts(){
  const snap=await getDocs(query(collection(db,'realms'),orderBy('order','asc'))).catch(()=>({docs:[]}));
  if(snap.docs.length>0){allProducts=snap.docs.map(d=>({id:d.id,...d.data()})).filter(p=>p.available!==false);}
  else allProducts=FALLBACK_PRODUCTS;
  renderProducts();
}

onAuthStateChanged(auth,async user=>{
  currentUser=user;
  if(user){
    document.getElementById('sb-user').style.display='flex';document.getElementById('sb-signin').style.display='none';
    const snap=await getDoc(doc(db,'buddies',user.uid)).catch(()=>null);
    const data=snap?.data()||{};
    userPts=data.points||0;userPurchases=data.purchases||[];
    document.getElementById('sb-name').textContent=user.displayName||'Member';
    document.getElementById('sb-pts').textContent=userPts.toLocaleString();
    document.getElementById('pts-val').textContent=userPts.toLocaleString();
    const av=document.getElementById('sb-av');
    if(user.photoURL)av.innerHTML=`<img src="${user.photoURL}">`;else av.textContent=initials(user.displayName||'M');
  }else{
    document.getElementById('sb-user').style.display='none';document.getElementById('sb-signin').style.display='flex';
    document.getElementById('pts-val').textContent='—';
  }
  loadProducts();
});
</script>
</body>
</html>
