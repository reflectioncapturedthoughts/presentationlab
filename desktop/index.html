<main class="main">
  <div class="page-wrap">
    <div style="margin-bottom:36px">
      <h1 class="page-title">Home</h1>
      <p class="page-subtitle">Explore ideas from the community.</p>
    </div>
    <div id="avr-section" style="display:none;margin-bottom:40px">
      <div class="section-header"><span class="section-title">AVR Picks</span><span class="avr-badge">Editor's Choice</span></div>
      <div id="avr-grid" class="post-grid"></div>
    </div>
    <div>
      <div class="section-header">
        <span class="section-title">Latest</span>
        <div class="filter-row" id="filter-row" style="margin:0">
          <button class="filter-chip active" data-cat="">All</button>
          <button class="filter-chip" data-cat="Creativity">Creativity</button>
          <button class="filter-chip" data-cat="Tech">Tech</button>
          <button class="filter-chip" data-cat="Design">Design</button>
          <button class="filter-chip" data-cat="Business">Business</button>
        </div>
      </div>
      <div id="posts-grid" class="post-grid" style="margin-top:16px"></div>
      <div id="loading-state" style="text-align:center;padding:64px"><div class="spinner spin"></div></div>
      <div id="empty-state" class="empty" style="display:none">
        <p class="empty-title">Nothing here yet</p><p class="empty-sub">Be the first to share your thoughts.</p>
        <a href="creativecreator.html" class="btn btn-primary">Start Writing</a>
      </div>
    </div>
  </div>
</main>
</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
import{getFirestore,doc,getDoc,collection,query,orderBy,limit,getDocs,updateDoc,arrayUnion,arrayRemove,increment}from"https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
const FB={apiKey:"AIzaSyDwUYRjUe7wKHp64d1vfYV-UDvnXaUuQVY",authDomain:"reflectioncapturedthoughts.firebaseapp.com",projectId:"reflectioncapturedthoughts",storageBucket:"reflectioncapturedthoughts.firebasestorage.app",messagingSenderId:"331335730832",appId:"1:331335730832:web:731df65bd40f9646adfa15",measurementId:"G-7NXNZDNDRE"};
const app=initializeApp(FB);const db=getFirestore(app);const auth=getAuth(app);
let currentUser=null,currentFilter='',allPosts=[];
function esc(s=''){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function timeAgo(d){if(!d)return'';const ms=d?.toMillis?d.toMillis():new Date(d).getTime();const diff=(Date.now()-ms)/1000;if(diff<60)return'just now';if(diff<3600)return Math.floor(diff/60)+'m ago';if(diff<86400)return Math.floor(diff/3600)+'h ago';return Math.floor(diff/86400)+'d ago'}
function initials(n){return(n||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2)}
function toast(msg,type='info'){const w=document.getElementById('toast-wrap');const t=document.createElement('div');t.className=`toast toast-${type}`;t.textContent=msg;w.appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300)},4000)}

function postCard(p){
  const liked=currentUser&&(p.likedBy||[]).includes(currentUser.uid);
  const ph=p.authorPhoto||'';
  const inits=initials(p.authorName);
  return`<article class="post-card" onclick="openPost('${p.id}','${p._col}')">
    <div class="post-card-top">
      <div class="post-card-meta">
        <div class="avatar avatar-sm">${ph?`<img src="${esc(ph)}" loading="lazy">`:esc(inits)}</div>
        <span class="post-card-author">${esc(p.authorName||'Member')}</span>
        <span class="post-card-time">${timeAgo(p.createdAt)}</span>
      </div>
      ${p.isAVRPick?'<span class="avr-badge">AVR Pick</span>':p.tags?.[0]?`<span class="badge badge-surface">${esc(p.tags[0])}</span>`:''}
    </div>
    <h2 class="post-card-title">${esc(p.title||'Untitled')}</h2>
    ${p.content?`<p class="post-card-excerpt">${esc((p.content||'').substring(0,180))}</p>`:''}
    <div class="post-card-footer">
      <div class="post-card-likes${liked?' liked':''}">
        <svg viewBox="0 0 24 24"><path d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z"/></svg>
        ${p.likes||0}
      </div>
      <span class="post-card-read">Read <svg viewBox="0 0 24 24"><path d="M4.5 12h15m0 0l-6.75-6.75M19.5 12l-6.75 6.75"/></svg></span>
    </div>
  </article>`;
}
window.openPost=function(id,col){location.href=`presentation.html?id=${id}&col=${col}`};

function renderPosts(){
  const filtered=currentFilter?allPosts.filter(p=>p.tags?.includes(currentFilter)):allPosts;
  const avr=allPosts.filter(p=>p.isAVRPick).slice(0,3);
  const avrSection=document.getElementById('avr-section');
  if(avr.length>0){avrSection.style.display='block';document.getElementById('avr-grid').innerHTML=avr.map(postCard).join('');}
  else avrSection.style.display='none';
  document.getElementById('loading-state').style.display='none';
  if(!filtered.length){document.getElementById('empty-state').style.display='block';document.getElementById('posts-grid').innerHTML='';return;}
  document.getElementById('empty-state').style.display='none';
  document.getElementById('posts-grid').innerHTML=filtered.map(postCard).join('');
}

async function loadPosts(){
  const[presSnap,gitSnap]=await Promise.all([
    getDocs(query(collection(db,'presentations'),orderBy('createdAt','desc'),limit(50))).catch(()=>({docs:[]})),
    getDocs(query(collection(db,'gitjit'),orderBy('createdAt','desc'),limit(50))).catch(()=>({docs:[]}))
  ]);
  const posts=[];
  presSnap.docs.forEach(d=>posts.push({id:d.id,...d.data(),_col:'presentations'}));
  gitSnap.docs.forEach(d=>posts.push({id:d.id,...d.data(),_col:'gitjit'}));
  posts.sort((a,b)=>{
    const ta=a.createdAt?.toMillis?a.createdAt.toMillis():new Date(a.createdAt||0).getTime();
    const tb=b.createdAt?.toMillis?b.createdAt.toMillis():new Date(b.createdAt||0).getTime();
    return tb-ta;
  });
  allPosts=posts;
  renderPosts();
}

document.querySelectorAll('.filter-chip').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.filter-chip').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter=btn.dataset.cat||'';
    renderPosts();
  });
});

onAuthStateChanged(auth,async user=>{
  currentUser=user;
  if(user){
    document.getElementById('sb-user').style.display='flex';
    document.getElementById('sb-signin').style.display='none';
    const snap=await getDoc(doc(db,'buddies',user.uid)).catch(()=>null);
    const data=snap?.data()||{};
    document.getElementById('sb-name').textContent=user.displayName||'Member';
    document.getElementById('sb-pts').textContent=(data.points||0).toLocaleString();
    const av=document.getElementById('sb-av');
    if(user.photoURL)av.innerHTML=`<img src="${user.photoURL}">`;else av.textContent=initials(user.displayName||'M');
  }else{document.getElementById('sb-user').style.display='none';document.getElementById('sb-signin').style.display='flex';}
  loadPosts();
});
</script>
</body>
