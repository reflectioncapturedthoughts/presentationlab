<main class="main">
  <div class="page-wrap-narrow">
    <div style="margin-bottom:36px"><h1 class="page-title">Leaderboard</h1><p class="page-subtitle">Top contributors by points earned.</p></div>
    <div id="podium" class="lb-podium" style="margin-bottom:36px"></div>
    <div class="card" style="padding:8px 0">
      <div id="lb-list" class="lb-list" style="padding:0 8px"></div>
      <div id="loading-state" style="text-align:center;padding:40px"><div class="spinner spin"></div></div>
    </div>
  </div>
</main>
</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
import{getFirestore,doc,getDoc,collection,query,orderBy,limit,getDocs}from"https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
const FB={apiKey:"AIzaSyDwUYRjUe7wKHp64d1vfYV-UDvnXaUuQVY",authDomain:"reflectioncapturedthoughts.firebaseapp.com",projectId:"reflectioncapturedthoughts",storageBucket:"reflectioncapturedthoughts.firebasestorage.app",messagingSenderId:"331335730832",appId:"1:331335730832:web:731df65bd40f9646adfa15",measurementId:"G-7NXNZDNDRE"};
const app=initializeApp(FB);const db=getFirestore(app);const auth=getAuth(app);
function esc(s=''){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function initials(n){return(n||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2)}

async function loadLeaderboard(){
  const snap=await getDocs(query(collection(db,'buddies'),orderBy('points','desc'),limit(50))).catch(()=>({docs:[]}));
  const users=snap.docs.map(d=>({id:d.id,...d.data()}));
  document.getElementById('loading-state').style.display='none';
  if(!users.length)return;
  const medals=['1st','2nd','3rd'];
  const pClasses=['p1','p2','p3'];
  const rClasses=['r1','r2','r3'];
  const podium=document.getElementById('podium');
  if(users.length>=3){
    // Show 2nd, 1st, 3rd order for podium
    const order=[users[1],users[0],users[2]];
    const oClasses=['p2','p1','p3'];
    const oRanks=['r2','r1','r3'];
    const oMedals=['2nd','1st','3rd'];
    podium.innerHTML=order.map((u,i)=>{
      const ph=u.photoURL||'';
      return`<div class="podium-card ${oClasses[i]}">
        <div class="podium-rank ${oRanks[i]}">${oMedals[i]}</div>
        <div class="avatar avatar-lg">${ph?`<img src="${esc(ph)}" loading="lazy">`:esc(initials(u.name))}</div>
        <div class="podium-name">${esc(u.name||'Member')}</div>
        <div class="podium-pts">${(u.points||0).toLocaleString()} pts</div>
      </div>`;
    }).join('');
  }
  const listItems=users.slice(3).map((u,i)=>{
    const ph=u.photoURL||'';
    return`<div class="lb-row">
      <div class="lb-rank">${i+4}</div>
      <div class="avatar avatar-sm">${ph?`<img src="${esc(ph)}" loading="lazy">`:esc(initials(u.name))}</div>
      <div class="lb-info"><div class="lb-name">${esc(u.name||'Member')}</div><div class="lb-posts">${u.presentationCount||0} posts · ${u.referralCount||0} referrals</div></div>
      <div class="lb-pts">${(u.points||0).toLocaleString()}</div>
    </div>`;
  });
  document.getElementById('lb-list').innerHTML=listItems.join('');
}

onAuthStateChanged(auth,async user=>{
  if(user){
    document.getElementById('sb-user').style.display='flex';
    document.getElementById('sb-signin').style.display='none';
    const snap=await getDoc(doc(db,'buddies',user.uid)).catch(()=>null);
    const data=snap?.data()||{};
    document.getElementById('sb-name').textContent=user.displayName||'Member';
    document.getElementById('sb-pts').textContent=(data.points||0).toLocaleString();
    const av=document.getElementById('sb-av');
    if(user.photoURL)av.innerHTML=`<img src="${user.photoURL}">`;else av.textContent=initials(user.displayName||'M');
  }else{document.getElementById('sb-user').style.display='none';document.getElementById('sb-signin').style.display='flex';}
  loadLeaderboard();
});
</script>
</body>
</html>
