<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">

</head>
<body>
<div id="toast-wrap"></div>
<div class="app">
<aside class="sidebar">

  <nav class="sidebar-nav">
    <a href="index.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M2.25 12l8.954-8.955a1.125 1.125 0 011.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"/></svg>Home</a>
    <a href="leaderboard.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M16.5 18.75h-9m9 0a3 3 0 013 3h-15a3 3 0 013-3m9 0v-3.375c0-.621-.503-1.125-1.125-1.125h-.871M7.5 18.75v-3.375c0-.621.504-1.125 1.125-1.125h.872m5.007 0H9.497m5.007 0a7.454 7.454 0 01-.982-3.172M9.497 14.25a7.454 7.454 0 00.981-3.172M5.25 4.236c-.982.143-1.954.317-2.916.52A6.003 6.003 0 007.73 9.728M5.25 4.236V4.5c0 2.108.966 3.99 2.48 5.228M5.25 4.236V2.721C7.456 2.41 9.71 2.25 12 2.25c2.291 0 4.545.16 6.75.47v1.516M7.73 9.728a6.726 6.726 0 002.748 1.35m8.272-6.842V4.5c0 2.108-.966 3.99-2.48 5.228m2.48-5.492a46.32 46.32 0 012.916.52 6.003 6.003 0 01-5.395 4.972m0 0a6.726 6.726 0 01-2.749 1.35m0 0a6.772 6.772 0 01-3.044 0"/></svg>Leaderboard</a>
    <a href="creativecreator.html" class="nav-item active"><svg viewBox="0 0 24 24"><path d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10"/></svg>Create</a>
    <a href="shop.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007zM8.625 10.5a.375.375 0 11-.75 0 .375.375 0 01.75 0zm7.5 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z"/></svg>Shop</a>
    <a href="profile.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M17.982 18.725A7.488 7.488 0 0012 15.75a7.488 7.488 0 00-5.982 2.975m11.963 0a9 9 0 10-11.963 0m11.963 0A8.966 8.966 0 0112 21a8.966 8.966 0 01-5.982-2.275M15 9.75a3 3 0 11-6 0 3 3 0 016 0z"/></svg>Profile</a>
  </nav>
  <div class="sidebar-footer"><div class="sidebar-user" id="sb-user" onclick="location.href='profile.html'" style="display:none"><div class="avatar avatar-sm" id="sb-av"></div><div class="sidebar-user-info"><div class="sidebar-user-name" id="sb-name"></div><div class="sidebar-user-pts"><span id="sb-pts">0</span> pts</div></div></div><button class="sidebar-sign-in" id="sb-signin" onclick="location.href='auth.html'" style="display:none"><svg viewBox="0 0 24 24" style="width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9"/></svg>Sign In</button></div>
</aside>
<main class="main">
  <div class="page-wrap-narrow">
    <div style="margin-bottom:32px"><h1 class="page-title">Create</h1><p class="page-subtitle">Share an idea, story, or reflection.</p></div>
    <div id="auth-gate" style="display:none" class="card" style="text-align:center;padding:48px 32px">
      <p style="font-size:1rem;color:var(--text-2);margin-bottom:16px">Sign in to share your work with the community.</p>
      <a href="auth.html?redirect=creativecreator.html" class="btn btn-primary">Sign In to Create</a>
    </div>
    <div id="editor-wrap" style="display:none">
      <div class="editor-wrap">
        <input class="editor-title-input" id="title-input" type="text" placeholder="Your title here…" maxlength="120">
        <textarea class="editor-body" id="body-input" placeholder="Write your thoughts, story, or ideas…" rows="16"></textarea>
      </div>
      <div style="display:flex;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap">
        <div class="tag-input-wrap" id="tag-wrap" style="flex:1;min-width:200px" onclick="document.getElementById('tag-field').focus()">
          <div id="tags-list"></div>
          <input class="tag-field" id="tag-field" placeholder="Add tags (press Enter)" maxlength="30">
        </div>
        <select class="input" id="collection-select" style="width:auto;padding:10px 14px">
          <option value="presentations">Presentations</option>
          <option value="gitjit">GitJit</option>
        </select>
        <button class="btn btn-primary" id="publish-btn" onclick="publish()">
          <svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5"/></svg>
          Publish
        </button>
      </div>
      <p style="font-size:.78rem;color:var(--text-3);margin-top:10px">Publishing earns you points when others like your work.</p>
    </div>
  </div>
</main>
</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
import{getFirestore,doc,getDoc,addDoc,updateDoc,increment,collection,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
const FB={apiKey:"AIzaSyDwUYRjUe7wKHp64d1vfYV-UDvnXaUuQVY",authDomain:"reflectioncapturedthoughts.firebaseapp.com",projectId:"reflectioncapturedthoughts",storageBucket:"reflectioncapturedthoughts.firebasestorage.app",messagingSenderId:"331335730832",appId:"1:331335730832:web:731df65bd40f9646adfa15",measurementId:"G-7NXNZDNDRE"};
const app=initializeApp(FB);const db=getFirestore(app);const auth=getAuth(app);
let currentUser=null;let tags=[];
function initials(n){return(n||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2)}
function toast(msg,type='info'){const w=document.getElementById('toast-wrap');const t=document.createElement('div');t.className=`toast toast-${type}`;t.textContent=msg;w.appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300)},5000)}

function renderTags(){
  document.getElementById('tags-list').innerHTML=tags.map((t,i)=>`<span class="tag-pill">${t}<button onclick="removeTag(${i})">×</button></span>`).join('');
}
window.removeTag=function(i){tags.splice(i,1);renderTags();}
document.getElementById('tag-field').addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===',')&&e.target.value.trim()){
    e.preventDefault();const v=e.target.value.trim().replace(',','');if(v&&!tags.includes(v)&&tags.length<6){tags.push(v);}
    e.target.value='';renderTags();
  }
});

window.publish=async function(){
  if(!currentUser){toast('Please sign in first','error');return;}
  const title=document.getElementById('title-input').value.trim();
  const content=document.getElementById('body-input').value.trim();
  const col=document.getElementById('collection-select').value;
  if(!title){toast('Please add a title','error');return;}
  if(!content||content.length<10){toast('Content is too short','error');return;}
  const btn=document.getElementById('publish-btn');btn.disabled=true;btn.textContent='Publishing…';
  try{
    const snap=await getDoc(doc(db,'buddies',currentUser.uid)).catch(()=>null);
    const buddy=snap?.data()||{};
    const postRef=await addDoc(collection(db,col),{
      uid:currentUser.uid,authorName:currentUser.displayName||'Member',
      authorEmail:currentUser.email,authorPhoto:currentUser.photoURL||'',
      title,content,tags,likes:0,likedBy:[],isAVRPick:false,
      createdAt:serverTimestamp(),updatedAt:serverTimestamp()
    });
    await updateDoc(doc(db,'buddies',currentUser.uid),{presentationCount:increment(1)});
    toast('Published! Others can now discover your work.','success');
    setTimeout(()=>location.href=`presentation.html?id=${postRef.id}&col=${col}`,1200);
  }catch(e){toast('Failed to publish: '+e.message,'error');btn.disabled=false;btn.textContent='Publish';}
};

onAuthStateChanged(auth,async user=>{
  currentUser=user;
  if(user){
    document.getElementById('auth-gate').style.display='none';document.getElementById('editor-wrap').style.display='block';
    document.getElementById('sb-user').style.display='flex';document.getElementById('sb-signin').style.display='none';
    const snap=await getDoc(doc(db,'buddies',user.uid)).catch(()=>null);const data=snap?.data()||{};
    document.getElementById('sb-name').textContent=user.displayName||'Member';
    document.getElementById('sb-pts').textContent=(data.points||0).toLocaleString();
    const av=document.getElementById('sb-av');
    if(user.photoURL)av.innerHTML=`<img src="${user.photoURL}">`;else av.textContent=initials(user.displayName||'M');
  }else{document.getElementById('auth-gate').style.display='block';document.getElementById('editor-wrap').style.display='none';document.getElementById('sb-user').style.display='none';document.getElementById('sb-signin').style.display='flex';}
});
</script>
</body>
</html>
