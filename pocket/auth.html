<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sign In — ARCT</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="toast-wrap"></div>
<div class="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-wrap">
        <img src="../assets/l.png" alt="ARCT">
        <video autoplay muted loop playsinline><source src="../assets/logo.mp4" type="video/mp4"></video>
      </div>
      <span class="auth-brand">ARCT</span>
    </div>
    <h1 class="auth-title">Welcome</h1>
    <p class="auth-sub">Reflection Captured Thoughts — ideas worth sharing.</p>
    <div class="field">
      <label class="label" for="ref-input">Referral code <span style="color:var(--text-3)">(optional — +50 pts)</span></label>
      <input class="input" type="text" id="ref-input" placeholder="e.g. A3BF19E0" maxlength="12" autocomplete="off" style="text-transform:uppercase;letter-spacing:.08em">
    </div>
    <button class="google-btn" id="google-btn" onclick="signInGoogle()">
      <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath fill='%234285F4' d='M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z'/%3E%3Cpath fill='%2334A853' d='M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z'/%3E%3Cpath fill='%23FBBC05' d='M11.69 28.18C11.25 26.86 11 25.45 11 24s.25-2.86.69-4.18v-5.7H4.34C2.85 17.09 2 20.45 2 24c0 3.55.85 6.91 2.34 9.88l7.35-5.7z'/%3E%3Cpath fill='%23EA4335' d='M24 10.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 4.18 29.93 2 24 2 15.4 2 7.96 6.93 4.34 14.12l7.35 5.7c1.73-5.2 6.58-9.07 12.31-9.07z'/%3E%3C/svg%3E" alt="G" width="18" height="18">
      Continue with Google
    </button>
    <p style="font-size:.72rem;color:var(--text-3);text-align:center;margin-top:12px">By continuing, you agree to our terms.</p>
  </div>
</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
import{getFirestore,doc,getDoc,setDoc,getDocs,query,collection,where,updateDoc,increment,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
const FB={apiKey:"AIzaSyDwUYRjUe7wKHp64d1vfYV-UDvnXaUuQVY",authDomain:"reflectioncapturedthoughts.firebaseapp.com",projectId:"reflectioncapturedthoughts",storageBucket:"reflectioncapturedthoughts.firebasestorage.app",messagingSenderId:"331335730832",appId:"1:331335730832:web:731df65bd40f9646adfa15",measurementId:"G-7NXNZDNDRE"};
const app=initializeApp(FB);const db=getFirestore(app);const auth=getAuth(app);const provider=new GoogleAuthProvider();
function toast(msg,type="info"){const w=document.getElementById("toast-wrap");const t=document.createElement("div");t.className=`toast toast-${type}`;t.textContent=msg;w.appendChild(t);setTimeout(()=>{t.style.opacity="0";t.style.transition="opacity .3s";setTimeout(()=>t.remove(),300)},4000);}
onAuthStateChanged(auth,u=>{if(u){const r=new URLSearchParams(location.search).get('redirect')||'index.html';location.replace(r);}});
window.signInGoogle=async function(){
  const btn=document.getElementById("google-btn");
  const refCode=(document.getElementById("ref-input").value||"").trim().toUpperCase();
  btn.disabled=true;
  try{
    const result=await signInWithPopup(auth,provider);
    const user=result.user;
    const bRef=doc(db,"buddies",user.uid);
    const snap=await getDoc(bRef);
    if(!snap.exists()){
      const myCode=user.uid.substring(0,8).toUpperCase();
      await setDoc(bRef,{uid:user.uid,name:user.displayName||"Member",email:user.email,photoURL:user.photoURL||"",points:0,referralCode:myCode,referredBy:null,referralCount:0,presentationCount:0,likedPosts:[],purchases:[],createdAt:serverTimestamp()});
      if(refCode&&refCode!==myCode){
        const rq=query(collection(db,"buddies"),where("referralCode","==",refCode));
        const rs=await getDocs(rq).catch(()=>null);
        if(rs&&!rs.empty){
          const rid=rs.docs[0].id;
          await Promise.all([updateDoc(doc(db,"buddies",rid),{points:increment(50),referralCount:increment(1)}),updateDoc(bRef,{points:increment(50),referredBy:rid})]);
          toast("Welcome! +50 pts earned","success");
        }
      }
    }
    const r=new URLSearchParams(location.search).get('redirect')||'index.html';
    setTimeout(()=>location.replace(r),600);
  }catch(e){toast(e.code==="auth/popup-closed-by-user"?"Cancelled":`Error: ${e.message}`,"error");btn.disabled=false;}
};
const urlRef=new URLSearchParams(location.search).get('ref')||'';
if(urlRef)document.getElementById("ref-input").value=urlRef.toUpperCase();
</script>
</body>
</html>
