<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In — Presentation Lab</title>
  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet"/>
</head>
<body class="auth-page">
<div id="toast-container"></div>

<div class="auth-logo">
  <div class="auth-logo-wrap">
    <img src="../assets/l.png" alt="logo"/>
    <video autoplay muted loop playsinline><source src="../assets/logo.mp4" type="video/mp4"></video>
  </div>
  <div class="auth-logo-name">Presentation Lab</div>
  <p style="font-size:0.75rem;color:var(--stone);margin-top:3px;">Powered by <a href="https://arct.onrender.com" target="_blank" style="color:var(--terra);font-weight:600;">ARCT</a></p>
</div>

<div class="panel">
  <div class="tabs">
    <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Sign In</button>
    <button class="tab-btn" id="tab-signup" onclick="switchTab('signup')">Sign Up</button>
  </div>

  <!-- LOGIN -->
  <div id="panel-login">
    <div class="panel-eyebrow">Welcome back</div>
    <h2 class="panel-title">Sign in</h2>
    <button class="btn btn-google btn-full" id="google-btn" style="margin-bottom:10px;">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.08 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.36-8.16 2.36-6.26 0-11.57-3.59-13.48-8.71l-7.98 6.2C6.51 42.62 14.62 48 24 48z"/></svg>
      Continue with Google
    </button>
    <button class="btn btn-ms btn-full" id="ms-btn">
      <svg width="18" height="18" viewBox="0 0 21 21"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>
      Continue with Microsoft
    </button>
    <p style="text-align:center;font-size:0.78rem;color:var(--stone);margin-top:14px;">
      New? <button onclick="switchTab('signup')" style="background:none;border:none;color:var(--terra);cursor:pointer;font-weight:600;font-family:inherit;font-size:inherit;">Create account</button>
    </p>
  </div>

  <!-- SIGNUP -->
  <div id="panel-signup" class="hidden">
    <div class="panel-eyebrow">Join us</div>
    <h2 class="panel-title">Create account</h2>
    <div id="referral-banner" class="referral-banner hidden">
      🎁 <strong>Referral!</strong> Both you and your friend earn <strong>+10 points</strong> when you join!
    </div>
    <div class="form-group">
      <label class="form-label">Referral Code <span style="color:var(--stone);font-weight:400;">(optional)</span></label>
      <input type="text" class="form-input" id="referral-code-input" placeholder="e.g. A1B2C3D4" maxlength="8" style="text-transform:uppercase;letter-spacing:0.1em;"/>
    </div>
    <button class="btn btn-google btn-full" id="google-signup-btn" style="margin-bottom:10px;">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.08 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.36-8.16 2.36-6.26 0-11.57-3.59-13.48-8.71l-7.98 6.2C6.51 42.62 14.62 48 24 48z"/></svg>
      Sign up with Google
    </button>
    <button class="btn btn-ms btn-full" id="ms-signup-btn">
      <svg width="18" height="18" viewBox="0 0 21 21"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>
      Sign up with Microsoft
    </button>
    <p style="text-align:center;font-size:0.78rem;color:var(--stone);margin-top:14px;">
      Have an account? <button onclick="switchTab('login')" style="background:none;border:none;color:var(--terra);cursor:pointer;font-weight:600;font-family:inherit;font-size:inherit;">Sign in</button>
    </p>
  </div>

  <p style="margin-top:16px;font-size:0.75rem;text-align:center;color:var(--stone);">
    <a href="index.html" style="color:var(--terra);">← Back to Presentation Lab</a>
  </p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, collection, query, where, getDocs, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged, GoogleAuthProvider, OAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";

const FB = {apiKey:"AIzaSyDwUYRjUe7wKHp64d1vfYV-UDvnXaUuQVY",authDomain:"reflectioncapturedthoughts.firebaseapp.com",projectId:"reflectioncapturedthoughts",storageBucket:"reflectioncapturedthoughts.firebasestorage.app",messagingSenderId:"331335730832",appId:"1:331335730832:web:731df65bd40f9646adfa15"};
const app = initializeApp(FB);
const db = getFirestore(app);
const auth = getAuth(app);
const googleProvider = new GoogleAuthProvider();
const msProvider = new OAuthProvider("microsoft.com");

function toast(msg,type="info"){const c=document.getElementById("toast-container");const t=document.createElement("div");t.className=`toast toast-${type}`;t.textContent=msg;c.appendChild(t);setTimeout(()=>{t.style.opacity="0";t.style.transition="opacity 0.3s";setTimeout(()=>t.remove(),300);},4000);}
function setLoading(btn,v){if(v){btn.dataset.orig=btn.innerHTML;btn.innerHTML=`<span class="spinner" style="width:16px;height:16px;border-width:2px;margin:0 auto;display:block;"></span>`;btn.disabled=true;}else{btn.innerHTML=btn.dataset.orig||btn.innerHTML;btn.disabled=false;}}

const params = new URLSearchParams(window.location.search);
const refCode = (params.get("ref")||"").toUpperCase().trim();
if(refCode){
  document.getElementById("referral-code-input").value=refCode;
  document.getElementById("referral-banner").classList.remove("hidden");
  switchTab('signup');
}

function genReferralCode(uid){return uid.substring(0,8).toUpperCase();}

window.switchTab = tab => {
  document.getElementById("tab-login").classList.toggle("active",tab==="login");
  document.getElementById("tab-signup").classList.toggle("active",tab==="signup");
  document.getElementById("panel-login").classList.toggle("hidden",tab!=="login");
  document.getElementById("panel-signup").classList.toggle("hidden",tab!=="signup");
};

async function saveBlogger(user){
  const ref=doc(db,"bloggers",user.uid);
  const snap=await getDoc(ref);
  if(!snap.exists()){
    await setDoc(ref,{uid:user.uid,fullName:user.displayName||"",email:user.email||"",photoURL:user.photoURL||"",points:0,referralCode:genReferralCode(user.uid),createdAt:new Date().toISOString()});
    return true;
  }
  return false;
}

async function applyReferral(newUid){
  const code=document.getElementById("referral-code-input").value.toUpperCase().trim();
  if(!code||code.length<6) return;
  try{
    const q=query(collection(db,"bloggers"),where("referralCode","==",code));
    const snap=await getDocs(q);
    if(snap.empty){toast("Referral code not found","info");return;}
    let referrerUid=null;
    snap.forEach(d=>{if(d.id!==newUid)referrerUid=d.id;});
    if(!referrerUid) return;
    const nuRef=doc(db,"bloggers",newUid);
    const nuSnap=await getDoc(nuRef);
    if(nuSnap.data()?.referredBy) return;
    await Promise.all([
      updateDoc(doc(db,"bloggers",referrerUid),{points:increment(10)}),
      updateDoc(nuRef,{points:increment(10),referredBy:referrerUid})
    ]);
    toast("Referral bonus! You both earned +10 points! 🎉","success");
  }catch(e){console.error(e);}
}

onAuthStateChanged(auth,user=>{
  if(user){
    const redirect=params.get("redirect")||"index.html";
    window.location.replace(redirect);
  }
});

async function oauthSignIn(provider,btn,isSignup){
  setLoading(btn,true);
  try{
    const result=await signInWithPopup(auth,provider);
    const isNew=await saveBlogger(result.user);
    if(isSignup&&isNew) await applyReferral(result.user.uid);
    toast("Welcome, "+(result.user.displayName||result.user.email)+"!","success");
    setTimeout(()=>{
      const redirect=params.get("redirect")||"index.html";
      window.location.replace(redirect);
    },800);
  }catch(e){
    const msg=e.code==="auth/popup-closed-by-user"?"Cancelled.":
              e.code==="auth/popup-blocked"?"Popup blocked — please allow popups.":
              e.message;
    toast(msg,"error");
    setLoading(btn,false);
  }
}

document.getElementById("google-btn").addEventListener("click",e=>oauthSignIn(googleProvider,e.currentTarget,false));
document.getElementById("ms-btn").addEventListener("click",e=>oauthSignIn(msProvider,e.currentTarget,false));
document.getElementById("google-signup-btn").addEventListener("click",e=>oauthSignIn(googleProvider,e.currentTarget,true));
document.getElementById("ms-signup-btn").addEventListener("click",e=>oauthSignIn(msProvider,e.currentTarget,true));
</script>
</body>
</html>
