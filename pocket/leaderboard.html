<body>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
import{getFirestore,doc,getDoc,collection,query,orderBy,limit,getDocs}from"https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
const FB={apiKey:"AIzaSyDwUYRjUe7wKHp64d1vfYV-UDvnXaUuQVY",authDomain:"reflectioncapturedthoughts.firebaseapp.com",projectId:"reflectioncapturedthoughts",storageBucket:"reflectioncapturedthoughts.firebasestorage.app",messagingSenderId:"331335730832",appId:"1:331335730832:web:731df65bd40f9646adfa15",measurementId:"G-7NXNZDNDRE"};
const app=initializeApp(FB);const db=getFirestore(app);const auth=getAuth(app);
function esc(s=''){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function initials(n){return(n||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2)}
async function load(){
  const snap=await getDocs(query(collection(db,'buddies'),orderBy('points','desc'),limit(50))).catch(()=>({docs:[]}));
  const users=snap.docs.map(d=>({id:d.id,...d.data()}));
  document.getElementById('loading-state').style.display='none';
  if(!users.length)return;
  const top3=users.slice(0,3);
  const order=[top3[1],top3[0],top3[2]].filter(Boolean);
  const oC=['p2','p1','p3'],oR=['r2','r1','r3'],oM=['2nd','1st','3rd'];
  document.getElementById('podium').innerHTML=order.map((u,i)=>{
    const ph=u.photoURL||'';
    return`<div class="podium-item ${oC[i]}">
      <div class="podium-rank ${oR[i]}">${oM[i]}</div>
      <div class="avatar avatar-md">${ph?`<img src="${esc(ph)}" loading="lazy">`:esc(initials(u.name))}</div>
      <div class="podium-name">${esc(u.name||'Member')}</div>
      <div class="podium-pts">${(u.points||0).toLocaleString()}</div>
    </div>`;
  }).join('');
  document.getElementById('lb-list').innerHTML=users.slice(3).map((u,i)=>{
    const ph=u.photoURL||'';
    return`<div class="lb-row">
      <div class="lb-rank">${i+4}</div>
      <div class="avatar avatar-sm" style="width:32px;height:32px;font-size:.76rem">${ph?`<img src="${esc(ph)}" loading="lazy">`:esc(initials(u.name))}</div>
      <div class="lb-info"><div class="lb-name">${esc(u.name||'Member')}</div><div class="lb-sub">${u.presentationCount||0} posts</div></div>
      <div class="lb-pts">${(u.points||0).toLocaleString()}</div>
    </div>`;
  }).join('');
}
onAuthStateChanged(auth,async user=>{
  if(user){const snap=await getDoc(doc(db,'buddies',user.uid)).catch(()=>null);const av=document.getElementById('tb-av');av.style.display='flex';if(user.photoURL)av.innerHTML=`<img src="${user.photoURL}" style="width:100%;height:100%;object-fit:cover">`;else av.textContent=initials(user.displayName||'M');}
  load();
});
</script>
</body>
</html>
