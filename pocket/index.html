<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Home — ARCT</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="toast-wrap"></div>
<div class="app">
<header class="topbar">
  <div class="topbar-logo">
    <div class="logo-wrap"><img src="../assets/l.png" alt="ARCT"><video autoplay muted loop playsinline><source src="../assets/logo.mp4" type="video/mp4"></video></div>
    <span class="topbar-brand">ARCT</span>
  </div>
  <div class="topbar-actions">
    <div id="tb-pts-wrap" style="display:none"><span class="topbar-pts" id="tb-pts">0 pts</span></div>
    <div class="topbar-avatar" id="tb-av" onclick="location.href='profile.html'" style="display:none"></div>
    <button class="topbar-icon-btn" id="tb-signin" onclick="location.href='auth.html'" style="display:none" title="Sign In">
      <svg viewBox="0 0 24 24"><path d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9"/></svg>
    </button>
  </div>
</header>
<main class="main">
  <div class="page" style="padding-top:12px">
    <div id="avr-section" style="display:none;margin-bottom:16px">
      <div class="section-hd"><span class="section-title">AVR Picks</span><span class="avr-badge">Editor's Choice</span></div>
      <div id="avr-list"></div>
    </div>
    <div class="section-hd" style="margin-bottom:10px">
      <span class="section-title">Latest</span>
    </div>
    <div class="filter-row" id="filter-row">
      <button class="filter-chip active" data-cat="">All</button>
      <button class="filter-chip" data-cat="Creativity">Creativity</button>
      <button class="filter-chip" data-cat="Tech">Tech</button>
      <button class="filter-chip" data-cat="Design">Design</button>
      <button class="filter-chip" data-cat="Business">Business</button>
    </div>
    <div id="posts-list"></div>
    <div id="loading-state" style="text-align:center;padding:40px"><div class="spinner spin"></div></div>
    <div id="empty-state" class="empty" style="display:none">
      <p class="empty-title">Nothing here yet</p><p class="empty-sub">Be the first to share.</p>
      <button class="btn btn-primary" onclick="location.href='creativecreator.html'">Start Writing</button>
    </div>
  </div>
</main>
<nav class="bottom-nav">
  <button class="tab active" onclick="location.href='index.html'"><svg viewBox="0 0 24 24"><path d="M2.25 12l8.954-8.955a1.125 1.125 0 011.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"/></svg>Home</button>
  <button class="tab" onclick="location.href='leaderboard.html'"><svg viewBox="0 0 24 24"><path d="M16.5 18.75h-9m9 0a3 3 0 013 3h-15a3 3 0 013-3m9 0v-3.375c0-.621-.503-1.125-1.125-1.125h-.871M7.5 18.75v-3.375c0-.621.504-1.125 1.125-1.125h.872m5.007 0H9.497m5.007 0a7.454 7.454 0 01-.982-3.172M9.497 14.25a7.454 7.454 0 00.981-3.172M5.25 4.236c-.982.143-1.954.317-2.916.52A6.003 6.003 0 007.73 9.728M5.25 4.236V4.5c0 2.108.966 3.99 2.48 5.228M5.25 4.236V2.721C7.456 2.41 9.71 2.25 12 2.25c2.291 0 4.545.16 6.75.47v1.516M7.73 9.728a6.726 6.726 0 002.748 1.35m8.272-6.842V4.5c0 2.108-.966 3.99-2.48 5.228m2.48-5.492a46.32 46.32 0 012.916.52 6.003 6.003 0 01-5.395 4.972m0 0a6.726 6.726 0 01-2.749 1.35m0 0a6.772 6.772 0 01-3.044 0"/></svg>Top</button>
  <button class="tab" onclick="location.href='creativecreator.html'"><svg viewBox="0 0 24 24"><path d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10"/></svg>Create</button>
  <button class="tab" onclick="location.href='shop.html'"><svg viewBox="0 0 24 24"><path d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007zM8.625 10.5a.375.375 0 11-.75 0 .375.375 0 01.75 0zm7.5 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z"/></svg>Shop</button>
  <button class="tab" onclick="location.href='profile.html'"><svg viewBox="0 0 24 24"><path d="M17.982 18.725A7.488 7.488 0 0012 15.75a7.488 7.488 0 00-5.982 2.975m11.963 0a9 9 0 10-11.963 0m11.963 0A8.966 8.966 0 0112 21a8.966 8.966 0 01-5.982-2.275M15 9.75a3 3 0 11-6 0 3 3 0 016 0z"/></svg>Me</button>
</nav>
</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
import{getFirestore,doc,getDoc,collection,query,orderBy,limit,getDocs}from"https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
const FB={apiKey:"AIzaSyDwUYRjUe7wKHp64d1vfYV-UDvnXaUuQVY",authDomain:"reflectioncapturedthoughts.firebaseapp.com",projectId:"reflectioncapturedthoughts",storageBucket:"reflectioncapturedthoughts.firebasestorage.app",messagingSenderId:"331335730832",appId:"1:331335730832:web:731df65bd40f9646adfa15",measurementId:"G-7NXNZDNDRE"};
const app=initializeApp(FB);const db=getFirestore(app);const auth=getAuth(app);
let currentUser=null,allPosts=[],currentFilter='';
function esc(s=''){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function timeAgo(d){if(!d)return'';const ms=d?.toMillis?d.toMillis():new Date(d).getTime();const diff=(Date.now()-ms)/1000;if(diff<60)return'just now';if(diff<3600)return Math.floor(diff/60)+'m ago';if(diff<86400)return Math.floor(diff/3600)+'h ago';return Math.floor(diff/86400)+'d ago'}
function initials(n){return(n||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2)}

function postCard(p){
  const liked=currentUser&&(p.likedBy||[]).includes(currentUser.uid);
  const ph=p.authorPhoto||'';
  return`<article class="post-card" onclick="location.href='presentation.html?id=${p.id}&col=${p._col}'">
    <div class="post-card-top">
      <div class="post-card-meta">
        <div class="avatar-sm">${ph?`<img src="${esc(ph)}" loading="lazy">`:esc(initials(p.authorName))}</div>
        <span class="post-author">${esc(p.authorName||'Member')}</span>
        <span class="post-time">${timeAgo(p.createdAt)}</span>
      </div>
      ${p.isAVRPick?'<span class="avr-badge">AVR Pick</span>':p.tags?.[0]?`<span class="badge badge-surface">${esc(p.tags[0])}</span>`:''}
    </div>
    <div class="post-title">${esc(p.title||'Untitled')}</div>
    ${p.content?`<div class="post-excerpt">${esc((p.content||'').substring(0,120))}</div>`:''}
    <div class="post-footer">
      <div class="post-likes${liked?' liked':''}"><svg viewBox="0 0 24 24"><path d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z"/></svg>${p.likes||0}</div>
      <span class="post-read">Read →</span>
    </div>
  </article>`;
}

function renderPosts(){
  const filtered=currentFilter?allPosts.filter(p=>p.tags?.includes(currentFilter)):allPosts;
  const avr=allPosts.filter(p=>p.isAVRPick).slice(0,2);
  const avrSec=document.getElementById('avr-section');
  if(avr.length){avrSec.style.display='block';document.getElementById('avr-list').innerHTML=avr.map(postCard).join('');}
  else avrSec.style.display='none';
  document.getElementById('loading-state').style.display='none';
  if(!filtered.length){document.getElementById('empty-state').style.display='block';document.getElementById('posts-list').innerHTML='';return;}
  document.getElementById('empty-state').style.display='none';
  document.getElementById('posts-list').innerHTML=filtered.map(postCard).join('');
}

async function loadPosts(){
  const[p,g]=await Promise.all([
    getDocs(query(collection(db,'presentations'),orderBy('createdAt','desc'),limit(40))).catch(()=>({docs:[]})),
    getDocs(query(collection(db,'gitjit'),orderBy('createdAt','desc'),limit(40))).catch(()=>({docs:[]}))
  ]);
  const posts=[];
  p.docs.forEach(d=>posts.push({id:d.id,...d.data(),_col:'presentations'}));
  g.docs.forEach(d=>posts.push({id:d.id,...d.data(),_col:'gitjit'}));
  posts.sort((a,b)=>(b.createdAt?.toMillis?.()??0)-(a.createdAt?.toMillis?.()??0));
  allPosts=posts;renderPosts();
}

document.querySelectorAll('.filter-chip').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.filter-chip').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');currentFilter=b.dataset.cat||'';renderPosts();
}));

onAuthStateChanged(auth,async user=>{
  currentUser=user;
  if(user){
    document.getElementById('tb-signin').style.display='none';
    const snap=await getDoc(doc(db,'buddies',user.uid)).catch(()=>null);
    const data=snap?.data()||{};
    document.getElementById('tb-pts-wrap').style.display='block';
    document.getElementById('tb-pts').textContent=(data.points||0)+' pts';
    document.getElementById('tb-av').style.display='flex';
    const av=document.getElementById('tb-av');
    if(user.photoURL)av.innerHTML=`<img src="${user.photoURL}" style="width:100%;height:100%;object-fit:cover">`;
    else av.textContent=initials(user.displayName||'M');
  }else{document.getElementById('tb-signin').style.display='flex';}
  loadPosts();
});
</script>
</body>
</html>
